global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: agentse
    static_configs:
      - targets: ["app:8080", "host.docker.internal:8080"]
    metrics_path: /metrics
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
