[project]
name = "agentse"
version = "0.1.0"
description = "Локальная мультиагентная система Agentse: supervisor + specialists, hierarchical memory, evals, observability"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agentse" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "structlog>=24.4.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
obs = ["langfuse>=2.57.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
agentse = "agentse.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
